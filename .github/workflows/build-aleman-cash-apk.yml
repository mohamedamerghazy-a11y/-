name: Build Al-Eman Cash APK

on:
  push:
  workflow_dispatch:

jobs:
  build-aleman-cash-apk:
    name: Build Standalone Al-Eman Cash APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode Registered Debug Keystore
        run: |
          if [ -f aleman-cash-app/signing/debug-keystore.b64 ]; then
            base64 -d aleman-cash-app/signing/debug-keystore.b64 > aleman-cash-app/debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > aleman-cash-app/debug.keystore
          else
            echo "ERROR: Registered debug keystore source not found."
            exit 1
          fi
          keytool -list -v -keystore aleman-cash-app/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"

      - name: Configure Android SDK and Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDK_MANAGER" ]; then
            echo "Downloading Android command-line tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager: $SDK_MANAGER"
          yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36.1" || true
          yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" -o /tmp/gradle-9.3.1.zip
          unzip -q /tmp/gradle-9.3.1.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          /tmp/gradle-9.3.1/bin/gradle --version

      - name: Build Al-Eman Cash Debug APK
        working-directory: aleman-cash-app
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK Signing Fingerprint and Prepare Download
        run: |
          mkdir -p dist-apk
          cp aleman-cash-app/app/build/outputs/apk/debug/app-debug.apk dist-apk/aleman-cash.apk
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs dist-apk/aleman-cash.apk
          fi
          ls -lh dist-apk/aleman-cash.apk

      - name: Upload Al-Eman Cash APK
        uses: actions/upload-artifact@v4
        with:
          name: aleman-cash-apk
          path: dist-apk/aleman-cash.apk
          retention-days: 30
          if-no-files-found: error
