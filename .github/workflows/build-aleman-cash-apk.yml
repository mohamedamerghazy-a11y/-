name: Build Al-Eman Cash APK

on:
  push:
  workflow_dispatch:

jobs:
  build-aleman-cash-apk:
    name: Build Standalone Al-Eman Cash APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Al-Eman Cash Debug APK
        working-directory: aleman-cash-app
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Download
        run: |
          mkdir -p dist-apk
          cp aleman-cash-app/app/build/outputs/apk/debug/app-debug.apk dist-apk/aleman-cash.apk
          ls -lh dist-apk/aleman-cash.apk

      - name: Upload Al-Eman Cash APK
        uses: actions/upload-artifact@v4
        with:
          name: aleman-cash-apk
          path: dist-apk/aleman-cash.apk
          retention-days: 30
          if-no-files-found: error
